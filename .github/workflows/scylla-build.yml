name: Scylla Firmware Build

on:
  workflow_dispatch:

  push:
    branches:
      - scylla-grblhal-latest
   
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - btt_scylla_h723_tmc5160
          - btt_scylla_h723_tmc5160_wifi_full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: |
          pio run -e ${{ matrix.environment }}

      - name: Show firmware files
        run: |
          ls -lh .pio/build/${{ matrix.environment }}/firmware.*

      - name: Generate SHA256 checksums
        run: |
          cd .pio/build/${{ matrix.environment }}
          sha256sum firmware.bin firmware.hex firmware.elf > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environment }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.hex
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/SHA256SUMS.txt
          if-no-files-found: error
